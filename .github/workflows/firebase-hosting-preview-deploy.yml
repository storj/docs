# This is the PRIVILEGED half of the pull request preview deploy.
#
# The build half (.github/workflows/firebase-hosting-pull-request.yml) runs on
# `pull_request` and gets no secrets when the pull request comes from a fork or
# from Dependabot, which is why it only builds and uploads an artifact. This
# workflow is triggered by `workflow_run`, so it runs in the context of the
# base repository on the default branch and does have access to the Firebase
# service account. That makes previews work for Dependabot and fork pull
# requests, which previously either failed or were skipped.
#
# SECURITY: this job holds secrets, so it must never check out or execute pull
# request code. It checks out the base branch for configuration only,
# downloads the build artifact, and deploys the static files. Everything that
# comes out of the artifact is treated as untrusted data.
#
# NOTE: GitHub only ever triggers `workflow_run` from the copy of this file on
# the default branch, so this workflow does nothing until it is merged to main.
#
# MERGE GATE: what actually blocks merging into main is branch protection's
# "require deployments to succeed before merging", naming the `Preview`
# environment - NOT a status check. GitHub looks for a successful, *active*
# `Preview` deployment recorded against the PULL REQUEST HEAD commit.
#
# That is the one thing a `workflow_run` job does not get for free. The run's
# SHA here is main, so the deployment GitHub creates for the job-level
# `environment: Preview` is recorded against main and does nothing for the pull
# request, leaving it stuck on "Missing successful active Preview deployment".
# This workflow therefore creates and completes a `Preview` deployment on
# `workflow_run.head_sha` itself, through the Deployments API.
#
# CHECK RUN: `Deploy Preview` is *not* the merge gate - the deployment above is.
# Branch protection cannot be read from inside a workflow, so the check run is
# still reported in case it is required too; it is cheap and it mirrors what the
# previous workflow produced. It used to be
# created by FirebaseExtended/action-hosting-deploy, but that action only does
# so when it can see a `pull_request` event payload:
#
#     const isPullRequest = !!github.context.payload.pull_request;
#     if (token && isPullRequest) { finish = await createCheck(...); }
#
# A `workflow_run` job never has that payload, so the action would silently
# never create the check, and a required check that is never reported leaves
# every pull request stuck on "Expected" and unmergeable. This workflow
# therefore opens and closes that check run itself, against the pull request
# head commit, which is what branch protection evaluates.

name: Deploy preview to Firebase Hosting

'on':
  workflow_run:
    # Must match the `name:` of .github/workflows/firebase-hosting-pull-request.yml
    workflows: ['Deploy to Firebase Hosting on PR']
    types: [completed]

permissions:
  contents: read
  actions: read # required to download an artifact from another workflow run
  checks: write # required to report the `Deploy Preview` check run
  deployments: write # required to record the `Preview` deployment that gates merging
  pull-requests: write # required to post the preview comment

jobs:
  deploy_preview:
    # Deliberately NOT limited to successful build runs. The job has to report
    # the required `Deploy Preview` check either way: a failed check is
    # actionable, a check that never appears is not.
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    environment: Preview
    steps:
      # Opened before anything else can fail, so every path below has a check
      # run to close. `workflow_run.head_sha` is the pull request head commit
      # (GitHub run metadata, not artifact content, so a fork pull request
      # cannot point it at someone else's commit).
      - name: Open the Deploy Preview check run
        id: check
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const { owner, repo } = context.repo
            const { data } = await github.rest.checks.create({
              owner,
              repo,
              name: 'Deploy Preview',
              head_sha: process.env.HEAD_SHA,
              status: 'in_progress',
              details_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            })
            core.setOutput('id', data.id)

      # THE MERGE GATE. Opened next to the check run and before anything can
      # fail, so every path below has a deployment to close. The job-level
      # `environment: Preview` further down makes GitHub record its own Preview
      # deployment, but against main (the `workflow_run` SHA), which the pull
      # request cannot use - this is the one branch protection evaluates.
      - name: Open the Preview deployment on the pull request head
        id: deployment
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const { owner, repo } = context.repo
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            // `required_contexts: []` is load-bearing: with the default, GitHub
            // waits on the commit's other checks and answers with a queued
            // "merged"/"conflict" message instead of creating a deployment.
            // `transient_environment`/`production_environment` are both false,
            // matching the deployments the previous workflow produced - the
            // shape branch protection is known to accept here.
            const { data } = await github.rest.repos.createDeployment({
              owner,
              repo,
              ref: process.env.HEAD_SHA,
              environment: 'Preview',
              auto_merge: false,
              required_contexts: [],
              transient_environment: false,
              production_environment: false,
              description: 'Firebase Hosting preview for this pull request',
            })
            if (!data || !data.id) {
              throw new Error(
                `GitHub did not create a deployment: ${JSON.stringify(data)}`
              )
            }
            core.setOutput('id', data.id)
            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: data.id,
              state: 'in_progress',
              log_url: runUrl,
              description: 'Deploying the Firebase Hosting preview',
              auto_inactive: false,
            })

      # The build failed, so there is nothing to deploy. Fail the job here,
      # before any artifact is downloaded or any secret is used: GitHub skips
      # the remaining steps and the closing step at the bottom reports the
      # check as failed.
      - name: Stop if the build run did not succeed
        if: github.event.workflow_run.conclusion != 'success'
        env:
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          echo "::error::The build run concluded \"${UPSTREAM_CONCLUSION}\"; there is nothing to deploy."
          exit 1

      # Deliberately checks out the BASE repository at the default branch: no
      # `ref:` is passed, which in `workflow_run` context resolves to main.
      # The pull request head is never checked out. This step exists only to
      # get the trusted firebase.base.json and .firebaserc.
      - uses: actions/checkout@v4

      # The artifact belongs to a different workflow run, so download-artifact
      # needs both the run id and a token. It is extracted into its own
      # directory so it cannot overwrite anything from the base checkout.
      - name: Download the build from the pull request run
        uses: actions/download-artifact@v4
        with:
          name: preview-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: pr-artifact

      # github.event.workflow_run.pull_requests is populated for same-repository
      # pull requests but empty for fork ones, so it cannot be relied on here.
      # The number travels in the artifact instead. That makes it untrusted
      # input: strip it down to digits before it is used anywhere.
      - name: Resolve pull request number
        id: pr
        run: |
          set -euo pipefail
          number="$(tr -cd '0-9' < pr-artifact/pr-number.txt | head -c 10)"
          if [ -z "$number" ]; then
            echo "::error::No usable pull request number in the build artifact"
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "Deploying preview for pull request #$number"

      # firebase.json is generated during the build (firebase.base.json plus
      # the redirects declared in the docs frontmatter) and is git-ignored, so
      # it is not in the base checkout. Rebuild it here from the base branch's
      # firebase.base.json and copy across only the redirect entries from the
      # build, field by field. The artifact's own firebase.json is never used
      # as-is: it could otherwise carry `predeploy` hooks, which firebase-tools
      # would happily execute inside this privileged job.
      - name: Assemble firebase.json from the base branch config
        run: |
          set -euo pipefail
          if [ -f pr-artifact/pr-firebase.json ] && jq -e . pr-artifact/pr-firebase.json >/dev/null 2>&1; then
            jq --slurpfile pr pr-artifact/pr-firebase.json '
              .hosting.redirects = [
                (($pr[0].hosting.redirects) // [])[]
                | select(type == "object")
                | select((.source | type) == "string" and (.destination | type) == "string")
                | {source, destination, type: (if (.type | type) == "number" then .type else 308 end)}
              ]
            ' firebase.base.json > firebase.json
          else
            echo "::warning::No usable firebase.json in the build artifact; deploying without the redirects from this pull request"
            cp firebase.base.json firebase.json
          fi
          echo "serving $(jq -r '.hosting.public' firebase.json) with $(jq '.hosting.redirects | length' firebase.json) redirects"

      # firebase.json serves "dist", so the build output has to sit at the repo
      # root next to it.
      - name: Stage the built site
        run: |
          set -euo pipefail
          if [ ! -d pr-artifact/dist ]; then
            echo "::error::The build artifact does not contain a dist directory"
            exit 1
          fi
          rm -rf dist
          mv pr-artifact/dist dist

      - name: Deploy to the preview channel
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_STORJ_MARKETING }}'
          projectId: storj-marketing
          # An explicit, stable channel per pull request, so a re-run replaces
          # the same preview rather than creating a new one.
          channelId: pr-${{ steps.pr.outputs.number }}
          # No repoToken and no auto-comment: in `workflow_run` context this
          # action has no pull request to comment on. We post it ourselves.
          disableComment: true

      - name: Comment the preview URL on the pull request
        # An explicit `if:` replaces the implicit success() condition, so spell
        # it out again - this step must not run after an earlier failure.
        if: >-
          success() &&
          (steps.deploy.outputs.details_url != '' || steps.deploy.outputs.urls != '')
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          DETAILS_URL: ${{ steps.deploy.outputs.details_url }}
          URLS: ${{ steps.deploy.outputs.urls }}
          EXPIRES: ${{ steps.deploy.outputs.expire_time_formatted }}
        with:
          script: |
            const marker = '<!-- firebase-hosting-preview -->'
            const prNumber = Number(process.env.PR_NUMBER)
            const url = (process.env.DETAILS_URL || process.env.URLS || '').trim()
            if (!prNumber || !url) {
              core.info('No preview URL to report; skipping the comment.')
              return
            }
            const { owner, repo } = context.repo
            const lines = [
              marker,
              '### Firebase preview',
              '',
              `Preview URL: ${url}`,
            ]
            if (process.env.EXPIRES) {
              lines.push('', `Expires: ${process.env.EXPIRES}`)
            }
            const body = lines.join('\n')
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: prNumber, per_page: 100 }
            )
            const existing = comments.find(
              (comment) => comment.body && comment.body.includes(marker)
            )
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              })
            }

      # THE ONLY PLACE THE CHECK RUN IS COMPLETED. Every failure path above
      # just fails the job and falls through to here, so the check can never be
      # written twice with conflicting conclusions. `always()` is essential: a
      # check run left "in progress" blocks the pull request forever with
      # nothing to click.
      - name: Close the Deploy Preview check run
        if: always() && steps.check.outputs.id != ''
        uses: actions/github-script@v7
        env:
          CHECK_ID: ${{ steps.check.outputs.id }}
          JOB_STATUS: ${{ job.status }}
          DETAILS_URL: ${{ steps.deploy.outputs.details_url }}
          URLS: ${{ steps.deploy.outputs.urls }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        with:
          script: |
            const { owner, repo } = context.repo
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            const previewUrl = (process.env.DETAILS_URL || process.env.URLS || '').trim()
            const upstream = process.env.UPSTREAM_CONCLUSION
            const jobStatus = process.env.JOB_STATUS

            let conclusion
            if (jobStatus === 'success') {
              conclusion = 'success'
            } else if (jobStatus === 'cancelled' || upstream === 'cancelled') {
              conclusion = 'cancelled'
            } else {
              conclusion = 'failure'
            }

            // Titles match what FirebaseExtended/action-hosting-deploy used to
            // report, so the check reads the same as it always has.
            let title
            let summary
            if (conclusion === 'success') {
              title = 'Deploy preview succeeded'
              summary = previewUrl
                ? `[${previewUrl}](${previewUrl})`
                : `The preview deployed, but no URL was reported. See ${runUrl}.`
            } else if (conclusion === 'cancelled') {
              title = 'Deploy preview cancelled'
              summary = `The preview deploy was cancelled. See ${runUrl}.`
            } else {
              title = 'Deploy preview failed'
              summary = upstream !== 'success'
                ? `The build run concluded "${upstream}", so there was nothing to deploy. See ${runUrl}.`
                : `See ${runUrl} for the deploy log.`
            }

            await github.rest.checks.update({
              owner,
              repo,
              check_run_id: Number(process.env.CHECK_ID),
              status: 'completed',
              conclusion,
              completed_at: new Date().toISOString(),
              details_url: previewUrl || runUrl,
              output: { title, summary },
            })

      # THE ONLY PLACE THE PREVIEW DEPLOYMENT IS COMPLETED. Deliberately the last
      # step in the job: GitHub records its own Preview deployment (against main)
      # for the job-level `environment:` when the job ends, and ordering this
      # last keeps the pull request head deployment the most recent successful
      # one for the environment. That ordering is load-bearing.
      #
      # `auto_inactive: false` stops this status from flipping every other pull
      # request's Preview deployment to `inactive`, which is what leaves older
      # pull requests stuck on "Missing successful active Preview deployment"
      # long after their own preview deployed fine.
      #
      # `always()` is essential for the same reason it is on the check run: a
      # deployment left `in_progress` blocks the pull request with nothing to
      # click. The `id` guard means a failure to create the deployment does not
      # try to close one that does not exist.
      - name: Close the Preview deployment on the pull request head
        if: always() && steps.deployment.outputs.id != ''
        uses: actions/github-script@v7
        env:
          DEPLOYMENT_ID: ${{ steps.deployment.outputs.id }}
          JOB_STATUS: ${{ job.status }}
          DETAILS_URL: ${{ steps.deploy.outputs.details_url }}
          URLS: ${{ steps.deploy.outputs.urls }}
        with:
          script: |
            const { owner, repo } = context.repo
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
            const previewUrl = (process.env.DETAILS_URL || process.env.URLS || '').trim()
            const state = process.env.JOB_STATUS === 'success' ? 'success' : 'failure'

            const status = {
              owner,
              repo,
              deployment_id: Number(process.env.DEPLOYMENT_ID),
              state,
              log_url: runUrl,
              description:
                state === 'success'
                  ? 'Preview deployed'
                  : 'The preview deploy did not succeed',
              auto_inactive: false,
            }
            // environment_url has to be a real URL or the API rejects the whole
            // status, which would leave the deployment in_progress forever.
            if (state === 'success' && /^https?:\/\//.test(previewUrl)) {
              status.environment_url = previewUrl
            }

            await github.rest.repos.createDeploymentStatus(status)

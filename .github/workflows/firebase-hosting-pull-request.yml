# Originally auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools
#
# This is the UNPRIVILEGED half of the pull request preview deploy.
#
# GitHub does not expose Actions secrets to `pull_request` runs that come from
# a fork or from Dependabot, so this workflow can never deploy. It therefore
# only builds the site and uploads the result as an artifact, with no secrets
# and no write permissions. The actual Firebase deploy happens in
# .github/workflows/firebase-hosting-preview-deploy.yml, which is triggered by
# `workflow_run` and runs in the base repository where the secrets exist.

name: Deploy to Firebase Hosting on PR
'on': pull_request

permissions:
  contents: read

jobs:
  build_and_preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
            # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx') }}
            # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
      - name: Build
        run: |
          npm ci
          npm run build

      # `npm run build` is a Next.js static export (output: 'export' with
      # distDir: 'dist'), so the deployable site lands in ./dist. The build also
      # generates ./firebase.json from firebase.base.json plus the redirects
      # declared in the docs frontmatter; that file is git-ignored, so the
      # deploy workflow cannot get it from a checkout. Carry it along under a
      # distinct name to make clear it is untrusted build output: the deploy
      # workflow copies only the redirect entries out of it.
      - name: Collect deploy metadata
        run: |
          set -euo pipefail
          echo "${{ github.event.pull_request.number }}" > pr-number.txt
          # Not fatal: the deploy falls back to the base branch redirects if
          # this is missing, and a broken preview must not block the pull request.
          cp firebase.json pr-firebase.json ||
            echo "::warning::No generated firebase.json to carry over"

      - uses: actions/upload-artifact@v4
        with:
          name: preview-build
          path: |
            dist
            pr-number.txt
            pr-firebase.json
          if-no-files-found: error
          include-hidden-files: true
          # Allow re-running the job without tripping over the previous attempt's artifact.
          overwrite: true
          retention-days: 1
